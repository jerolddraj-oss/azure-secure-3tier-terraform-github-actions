name: Terraform Azure Secure 3-Tier

on:
  pull_request:
    branches: [main]
    paths: ["**/*.tf", "**/*.tfvars.example", ".github/workflows/**", "SECURITY_RULES.md", "README.md"]
  push:
    branches: [main]
    paths: ["**/*.tf", "**/*.tfvars.example", ".github/workflows/**", "SECURITY_RULES.md", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: secure3tier-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform module validation
        run: |
          set -e
          for d in environments/prod modules/* modules/hub-network/peering modules/security/routes; do
            [ -d "$d" ] || continue
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'validation' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        working-directory: environments/prod
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=secure3tier/prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Terraform plan
        working-directory: environments/prod
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_tls_certificate_pfx_base64: ${{ secrets.TLS_CERTIFICATE_PFX_BASE64 }}
          TF_VAR_tls_certificate_password: ${{ secrets.TLS_CERTIFICATE_PASSWORD }}
        run: terraform plan -out=tfplan
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: secure3tier-tfplan
          path: environments/prod/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        working-directory: environments/prod
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=secure3tier/prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - uses: actions/download-artifact@v4
        with:
          name: secure3tier-tfplan
          path: environments/prod/
      - name: Apply reviewed plan
        working-directory: environments/prod
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_tls_certificate_pfx_base64: ${{ secrets.TLS_CERTIFICATE_PFX_BASE64 }}
          TF_VAR_tls_certificate_password: ${{ secrets.TLS_CERTIFICATE_PASSWORD }}
        run: terraform apply -auto-approve tfplan
